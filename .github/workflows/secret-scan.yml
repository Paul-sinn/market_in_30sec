name: secret-scan

# 커밋된 키 모양 문자열을 전체 이력에서 찾는다(#17). pre-commit 훅(.githooks)을 켜지 않은 클론의 대안.
# 레포가 공개라 이 로그도 공개다: --redact로 찾은 값을 가린다. secrets는 쓰지 않는다
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # 전체 이력
          persist-credentials: false
      - name: Install gitleaks (pinned version and sha256)
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: 8.30.1
          # 출처: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt (linux_x64)
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

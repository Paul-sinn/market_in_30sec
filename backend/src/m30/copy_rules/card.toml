# card.toml
# 카드 줄·시장 한눈에·아침 알림 금지어 (HANDOFF 3-3).
# 카드 검사는 arena.toml의 always_banned도 함께 검사한다. 원형을 적는다.
# 코드는 원형 뒤에 s·es·d·ed·ing이 붙은 형태, e로 끝나면 e를 뺀 ing(plunging), y로 끝나면 ies·ied(opportunities, rallied)를 잡는다.
# 불규칙형은 따로 적어야 잡는다(sank). bought·sold는 못 잡는다
banned = [
  "buy", "sell", "should", "bullish", "bearish", "likely to rise", "upside",
  "downside", "opportunity", "undervalued", "overvalued", "momentum",
  "breakout", "rally ahead",
]
emotion_verbs = [
  "soar", "plunge", "skyrocket", "crash", "tank",
  "surge", "plummet", "rocket", "tumble", "slump", "spike", "jump",
  "rally", "sink", "sank", "dive", "collapse", "explode", "nosedive",
]
# 줄 끝 출처 꼬리표 (card-copy-rules 1장 7번). 줄 끝의 이 꼬리표만 단어·숫자 수에서 뺀다.
# 그 외 줄 끝 괄호는 본문으로 센다. 출처가 늘면 여기에 더한다. "Annual report"는 알아두기 전용(#66, 웹이 붙인다. 첫 번째 줄에는 쓰지 않는다)
source_tags = ["Company", "SEC filing", "Annual report"]
# 알아두기(#66) 전용 순위·비교·수량 표현. 10-K의 순위·어림 수량도 숫자에서 나온 값이라 1년 뒤 틀릴 수 있다(HANDOFF 3-3).
# 원형만(어미 변화는 코드가 잡는다: millions, hundreds). 'than'이 비교급 전부(larger than, more than)를 잡는다. 첫 번째 줄·연관 소식에는 쓰지 않는다
# 수량 단어는 number_words(첫 번째 줄과 공유)에 넣지 않고 여기에만 둔다. higher·lower·greater·맨 more는 넣지 않는다(Greater China, higher education). 판정 프롬프트에 맡긴다
quiet_fact_banned = [
  "largest", "biggest", "greatest", "highest", "lowest", "smallest", "fastest", "best",
  "top", "leading", "leader", "leads", "most", "first", "second", "third",
  "more than", "than",
  "million", "billion", "trillion", "thousand", "hundred", "dozen",
  "larger", "bigger", "better", "faster", "smaller", "superior",
]
# 숫자 단어(#14). 숫자판(3%, $94B)과 합쳐 "숫자는 줄당 하나"로 센다. 대소문자 무시, 단어 경계.
# 서수(first, second)·a/an/single·double/twice·단위(million, billion)는 값이 아니라 넣지 않는다. one-time·one-off는 코드가 빼고 센다
# 순서를 지킨다: 앞 아홉 개(one…nine)가 twenty-five 같은 십 단위 복합의 뒷자리다
number_words = [
  "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
  "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen",
  "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety",
  "hundred",
]

[project]
name = "m30"
version = "0.1.0"
description = "30초 종목 리포트 서버"
requires-python = ">=3.13"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = ["live: 실제 외부 API를 부른다. 기본 실행에서 제외, 요청할 때만 -m live"]
